<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d12"/><stop offset="1" stop-color="#11151d"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4fd1e0"/><stop offset="1" stop-color="#f0873f"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#4fd1e0" stop-opacity=".28"/><stop offset="1" stop-color="#4fd1e0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f0873f" stop-opacity=".22"/><stop offset="1" stop-color="#f0873f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <ellipse cx="1010" cy="140" rx="420" ry="320" fill="url(#glow)"/>
  <ellipse cx="180" cy="600" rx="420" ry="300" fill="url(#glow2)"/>

  <text x="88" y="148" font-family="Liberation Mono, monospace" font-size="19" letter-spacing="5" fill="#4fd1e0">MECHANICAL ENGINEERING PORTFOLIO</text>
  <text x="88" y="256" font-family="Liberation Sans, Noto Sans, sans-serif" font-weight="bold" font-size="90" fill="#eef1f6">John Silva</text>
  <text x="88" y="306" font-family="Liberation Sans, Noto Sans, sans-serif" font-size="30" fill="#c2cad6">Technical Director &amp; Co-owner · CWT Group</text>
  <text x="88" y="344" font-family="Liberation Sans, Noto Sans, sans-serif" font-size="26" fill="#8b94a3">MSc Mechanical Engineering · Laser welding specialist</text>
  <rect x="88" y="382" width="180" height="4" rx="2" fill="url(#rule)"/>

  <g font-family="Liberation Sans, Noto Sans, sans-serif">
    <text x="88"  y="482" font-size="54" font-weight="bold" fill="#f0873f">Tripled</text>
    <text x="88"  y="516" font-size="20" fill="#8b94a3">turnover since FY2017</text>

    <text x="430" y="482" font-size="54" font-weight="bold" fill="#f0873f">+10%</text>
    <text x="430" y="516" font-size="20" fill="#8b94a3">avg weld tensile strength</text>

    <text x="780" y="482" font-size="54" font-weight="bold" fill="#f0873f">Zero</text>
    <text x="780" y="516" font-size="20" fill="#8b94a3">non-conformances &#183; 2025 audit</text>
  </g>

  <rect x="0" y="614" width="1200" height="16" fill="url(#rule)" opacity=".9"/>
</svg>
